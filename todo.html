<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>To Do | Genshin Impact</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor"
            crossorigin="anonymous"
        />
        <link href="index.css" rel="stylesheet" />
    </head>

    <body class="container-fluid">
        <h1>Genshin Impact</h1>
        <nav class="navbar navbar-expand navbar-light bg-light mb-3">
            <div class="container-fluid">
                <div class="navbar-nav">
                    <a class="nav-link" href="./">Home</a>
                    <a class="nav-link" href="./characters">Characters</a>
                    <a class="nav-link" href="./weapons">Weapons</a>
                    <a class="nav-link" href="./materials">Materials</a>
                    <a class="nav-link" href="./targets">Targets</a>
                    <a class="nav-link active" aria-current="page" href="./todo">To Do</a>
                    <a class="nav-link" href="./sync">Sync</a>
                </div>
            </div>
        </nav>

        <h2>To Do</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>Character</th>
                    <th>Attribute</th>
                    <th>Target</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="todo-upgrade-actions"></tbody>
        </table>

        <dialog id="material-edit-dialog">
            <form method="dialog">
                <div class="mb-3">
                    <label class="form-label w-100">
                        Quantity:
                        <input type="number" min="0" class="form-control" id="material-edit-quantity" />
                    </label>
                </div>
                <div>
                    <button class="btn btn-primary" value="save">Save</button>
                    <button class="btn btn-secondary" value="cancel">Cancel</button>
                </div>
            </form>
        </dialog>

        <footer class="py-3 text-muted">
            <hr />
            Copyright 2022
            <a class="text-reset" href="https://github.com/twpol">James Ross</a>,
            <a class="text-reset" href="https://github.com/twpol/genshin-impact/tree/gh-pages">source code on GitHub</a>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/gh/theBowja/genshin-db@v4.3.1/dist/genshindb-none.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/theBowja/genshin-db@v4.3.1/dist/data/scripts/english-characters.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/theBowja/genshin-db@v4.3.1/dist/data/scripts/english-materials.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/theBowja/genshin-db@v4.3.1/dist/data/scripts/english-talents.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/theBowja/genshin-db@v4.3.1/dist/data/scripts/english-weapons.js"></script>
        <script src="pages/todo.mjs" type="module"></script>
    </body>
</html>
